                                    <div class="text-xs text-gold-400 font-bold mb-1">TÌNH HUỐNG:</div>
                                    <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${data.scenario}</p>
                                </div>
                                <div class="p-3 bg-navy-800 rounded-lg text-xs sm:text-sm font-semibold text-white border-l-2 border-l-gold-500">
                                    ❓ ${data.question}
                                </div>
                                <div>
                                    <button onclick="toggleAnswer(this)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-gold-400 font-semibold text-xs rounded-lg border border-slate-700 transition flex items-center gap-2">
                                        <i class="fa-solid fa-key"></i> Xem Đáp Án
                                    </button>
                                    <div class="answer-box hidden mt-3 p-4 rounded-xl bg-emerald-950/40 border border-emerald-500/30 text-xs sm:text-sm text-emerald-200 whitespace-pre-line leading-relaxed">
                                        ${data.answer}
                                    </div>
                                </div>
                            </div>
                            <div class="text-xs text-slate-500">Nhấn nút "Xem Đáp Án" để hiển thị phân tích.</div>
                        </div>
                    `;
                    break;

                case "summary":
                    html = `
                        <div class="flex flex-col h-full justify-between">
                            <div>
                                <span class="text-xs font-bold text-gold-400 tracking-wider uppercase">${data.category}</span>
                                <h2 class="text-2xl sm:text-3xl font-bold text-white mt-1">${data.title}</h2>
                            </div>
                            <div class="my-auto space-y-3 max-w-3xl">
                                ${data.bullets.map((b, i) => `
                                    <div class="glass-card p-4 rounded-xl flex items-center gap-4">
                                        <span class="w-7 h-7 rounded-full bg-gold-500 text-navy-950 font-black flex items-center justify-center text-xs flex-shrink-0">${i+1}</span>
                                        <p class="text-xs sm:text-sm font-medium text-slate-200 leading-relaxed">${b}</p>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="text-xs text-slate-400">Nắm vững bản chất - Vận dụng chuẩn xác.</div>
                        </div>
                    `;
                    break;

                case "thankyou":
                    html = `
                        <div class="relative w-full h-full flex flex-col justify-between p-6 sm:p-10 rounded-xl overflow-hidden text-center">
                            <div class="absolute inset-0 z-0 opacity-15 bg-cover bg-center" style="background-image: url('${data.bgImage}')"></div>
                            
                            <div class="relative z-10 flex justify-center">
                                <span class="px-3 py-1 bg-gold-500/20 text-gold-400 border border-gold-500/30 rounded-full text-xs font-semibold tracking-wider uppercase">${data.badge}</span>
                            </div>

                            <div class="relative z-10 my-auto">
                                <h1 class="text-2xl sm:text-4xl md:text-5xl font-black gradient-text mb-4">${data.title}</h1>
                                <p class="text-sm sm:text-base text-slate-300 font-light">${data.subtitle}</p>
                            </div>

                            <div class="relative z-10 pt-6 border-t border-slate-800/80 flex flex-col sm:flex-row justify-between items-center gap-2 text-xs text-slate-400">
                                <div>Báo cáo bởi: <strong class="text-white">${data.presenters.join(" & ")}</strong></div>
                                <div>Chương IV: Thực Hiện Pháp Luật</div>
                            </div>
                        </div>
                    `;
                    break;
            }

            slideContent.innerHTML = html;
        }

        function toggleAnswer(btn) {
            const answerBox = btn.nextElementSibling;
            if (answerBox.classList.contains('hidden')) {
                answerBox.classList.remove('hidden');
                btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i> Ẩn Đáp Án';
            } else {
                answerBox.classList.add('hidden');
                btn.innerHTML = '<i class="fa-solid fa-key"></i> Xem Đáp Án';
            }
        }

        function goToNextSlide() {
            if (currentSlide < slidesData.length - 1) {
                currentSlide++;
                renderSlide(currentSlide);
            }
        }

        function goToPrevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide(currentSlide);
            }
        }

        prevBtn.addEventListener('click', goToPrevSlide);
        nextBtn.addEventListener('click', goToNextSlide);

        slideSelect.addEventListener('change', (e) => {
            currentSlide = parseInt(e.target.value);
            renderSlide(currentSlide);
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                e.preventDefault();
                goToNextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                goToPrevSlide();
            }
        });

        // Fullscreen Toggle
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // Initialize presentation
        window.onload = function() {
            initSelectOptions();
            renderSlide(currentSlide);
        };
    </script>
</body>
</html>
